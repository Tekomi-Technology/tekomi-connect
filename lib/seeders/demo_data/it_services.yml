scripts:
  - key: erp_quote
    labels: ['bao-gia', 'khach-moi']
    priority: high
    messages:
      - in: 'Chào bên em, công ty anh phân phối vật liệu xây dựng, có 3 kho. Anh đang tìm phần mềm quản lý kho và bán hàng.'
      - out: 'Dạ em chào anh ạ. Bên em có giải pháp ERP quản lý kho, bán hàng và công nợ. Anh cho em hỏi hiện mỗi kho có khoảng bao nhiêu mã hàng và bao nhiêu người dùng ạ?'
      - in: 'Khoảng 2.000 mã hàng, 15 người dùng. Bên anh đang quản lý bằng Excel, hay bị lệch tồn kho.'
      - out: 'Dạ với quy mô này gói ERP Tiêu chuẩn là phù hợp ạ, có đồng bộ tồn kho theo thời gian thực giữa các kho. Em gửi anh báo giá chi tiết qua email trong hôm nay nhé.'
      - in: 'Ok em. Ngân sách bên anh tầm 150 triệu, cần chạy trước Tết. Có tích hợp được hóa đơn điện tử không?'
      - out: 'Dạ có ạ, hệ thống tích hợp sẵn hóa đơn điện tử. Thời gian triển khai khoảng 6–8 tuần nên kịp trước Tết ạ.'
    csat: { rating: 5, feedback: 'Tư vấn nhanh, rõ ràng' }
    analysis:
      served_by: agent
      quality:
        understanding: { score: 5, reason: 'Hỏi đúng quy mô kho và số người dùng.', evidence: ['Anh cho em hỏi hiện mỗi kho có khoảng bao nhiêu mã hàng'] }
        completeness: { score: 4, reason: 'Trả lời đủ, còn thiếu chi phí bảo trì hằng năm.' }
        accuracy: { score: 5, reason: 'Thông tin gói và thời gian triển khai rõ ràng.' }
        tone: { score: 5, reason: 'Xưng hô anh – em lịch sự, nhất quán.' }
        resolution: { score: 4, reason: 'Đã hẹn gửi báo giá trong ngày.' }
        proactiveness: { score: 4, reason: 'Chủ động gợi ý gói phù hợp quy mô.' }
      customer:
        needs: 'Phần mềm quản lý kho và bán hàng cho 3 kho'
        products_of_interest: 'ERP Tiêu chuẩn'
        current_solution: 'Quản lý bằng Excel'
        budget: '150 triệu'
        timeline: 'Trước Tết'
      insight:
        summary: 'Nhà phân phối 3 kho cần ERP thay Excel, ngân sách rõ ràng.'
        interest_level: high
        sentiment: positive
        pain_points: ['Lệch tồn kho giữa các kho', 'Quản lý thủ công bằng Excel']
        barriers: ['Cần kịp trước Tết']
        motivations: ['Tồn kho chính xác', 'Có hóa đơn điện tử']
      conversation_state:
        already_done: ['Hẹn gửi báo giá qua email trong hôm nay']
        open_questions: ['Chi phí bảo trì hằng năm']
      care:
        next_action: 'Gửi báo giá ERP Tiêu chuẩn kèm lộ trình 8 tuần'
        talking_points: ['Đồng bộ tồn kho thời gian thực', 'Kịp triển khai trước Tết']
        opportunity: 'Bán thêm module công nợ và báo cáo'
        contact_timing: 'Trong hôm nay'

  - key: hrm_demo
    labels: ['lich-demo', 'khach-moi']
    messages:
      - in: 'Cho chị hỏi phần mềm quản lý nhân sự bên em có chấm công bằng khuôn mặt không?'
      - out: 'Dạ có chị ạ. Phần mềm HRM bên em hỗ trợ chấm công khuôn mặt, GPS và tính lương tự động. Bên chị hiện có bao nhiêu nhân viên ạ?'
      - in: 'Khoảng 120 người, chia 3 ca. Chị muốn xem demo trước.'
      - out: 'Dạ em xếp lịch demo online cho chị vào 9h sáng thứ Năm này được không ạ? Buổi demo khoảng 45 phút.'
      - in: 'Được em, gửi chị link họp nhé.'
      - out: 'Dạ em đã gửi lịch và link Google Meet qua Zalo cho chị rồi ạ.'
    csat: { rating: 5, feedback: '' }
    analysis:
      served_by: agent
      quality:
        understanding: { score: 4, reason: 'Hỏi số nhân viên, chưa hỏi hình thức tính lương.' }
        completeness: { score: 5, reason: 'Trả lời đủ câu hỏi về chấm công.' }
        accuracy: { score: 5, reason: 'Thông tin tính năng chính xác.' }
        tone: { score: 5, reason: 'Lịch sự, xưng hô chị – em đúng.' }
        resolution: { score: 5, reason: 'Đã chốt lịch demo cụ thể.', evidence: ['vào 9h sáng thứ Năm này được không ạ'] }
        proactiveness: { score: 4, reason: 'Chủ động đề xuất lịch demo.' }
      customer:
        needs: 'Chấm công khuôn mặt, quản lý 3 ca'
        products_of_interest: 'Phần mềm HRM'
        budget: ''
        timeline: ''
      insight:
        summary: 'Doanh nghiệp 120 nhân sự, 3 ca, đang tìm hiểu HRM.'
        interest_level: medium
        sentiment: positive
        pain_points: ['Chấm công 3 ca thủ công']
        barriers: ['Muốn xem demo trước khi quyết định']
        motivations: ['Tự động tính lương']
      conversation_state:
        already_done: ['Đã gửi lịch demo 9h thứ Năm']
        open_questions: []
      care:
        next_action: 'Chuẩn bị demo chấm công 3 ca và tính lương'
        talking_points: ['Chấm công khuôn mặt, GPS', 'Báo cáo lương theo ca']
        opportunity: 'Gói HRM cho 120 người dùng'
        contact_timing: 'Nhắc lịch trước 1 ngày'

  - key: website_design
    labels: ['bao-gia']
    messages:
      - in: 'Em ơi bên em có làm website bán hàng không? Chị bán nội thất, muốn có web đặt hàng online.'
      - out: 'Dạ có chị ạ. Bên em thiết kế website bán hàng có giỏ hàng, thanh toán online và quản lý đơn. Chị đã có tên miền chưa ạ?'
      - in: 'Chưa có. Làm mất bao lâu, giá khoảng bao nhiêu em?'
      - out: 'Dạ gói website bán hàng từ 25 triệu, làm trong 4 tuần, tặng tên miền và hosting năm đầu ạ. Em gửi chị vài mẫu giao diện ngành nội thất để chị tham khảo nhé.'
    csat: { rating: 4, feedback: 'Cần thêm mẫu giao diện' }

  - key: mobile_app
    labels: ['bao-gia', 'khach-moi']
    messages:
      - in: 'Bên em làm app đặt lịch cho spa được không? Chị có 4 cơ sở.'
      - out: 'Dạ được chị ạ. App cho khách đặt lịch, chọn kỹ thuật viên, nhận thông báo và tích điểm thành viên. Chị cần cả iOS và Android đúng không ạ?'
      - in: 'Ừ cả hai. Chị muốn ra mắt trước tháng 12.'
      - out: 'Dạ em sẽ gửi chị bản đề xuất tính năng và báo giá. Để kịp tháng 12, mình nên chốt yêu cầu trong tuần này ạ.'

  - key: domain_renew
    labels: ['gia-han']
    messages:
      - in: 'Tên miền của công ty anh sắp hết hạn, gia hạn thế nào em?'
      - out: 'Dạ anh cho em xin tên miền để em kiểm tra ạ.'
      - in: 'minhphat-vlxd.vn'
      - out: 'Dạ tên miền hết hạn ngày 15 tháng sau. Phí gia hạn 1 năm là 750.000đ, 2 năm được giảm 10% ạ. Anh chọn gói nào để em xuất hóa đơn ạ?'
      - in: 'Gia hạn 2 năm luôn nhé.'
      - out: 'Dạ em đã gia hạn 2 năm và gửi hóa đơn qua email cho anh rồi ạ.'
    csat: { rating: 5, feedback: 'Nhanh gọn' }

  - key: hosting_down
    labels: ['su-co']
    priority: urgent
    messages:
      - in: 'Website bên chị không vào được, báo lỗi 502 từ sáng!'
      - out: 'Dạ em xin lỗi chị. Em kiểm tra ngay ạ, chị cho em xin địa chỉ website.'
      - in: 'ankhangpharma.vn, khách đang không đặt hàng được, gấp lắm em.'
      - out: 'Dạ máy chủ bị quá tải do lượng truy cập tăng đột biến. Kỹ thuật đang nâng cấp tài nguyên, dự kiến 30 phút nữa website hoạt động lại ạ.'
      - in: 'Ok em, xong báo chị ngay nhé.'
      - out: 'Dạ website đã hoạt động bình thường rồi ạ. Bên em cũng đã tăng giới hạn tài nguyên để tránh lặp lại.'
    csat: { rating: 3, feedback: 'Xử lý được nhưng bị gián đoạn khá lâu' }
    ticket:
      title: 'Website ankhangpharma.vn lỗi 502 do quá tải'
      description: 'Máy chủ quá tải, cần theo dõi tài nguyên và đề xuất nâng gói hosting.'
    analysis:
      served_by: agent
      quality:
        understanding: { score: 5, reason: 'Nắm ngay mức độ khẩn cấp.' }
        completeness: { score: 4, reason: 'Có nguyên nhân và thời gian xử lý.' }
        accuracy: { score: 5, reason: 'Chẩn đoán đúng nguyên nhân quá tải.' }
        tone: { score: 5, reason: 'Xin lỗi và trấn an khách phù hợp.', evidence: ['Dạ em xin lỗi chị. Em kiểm tra ngay ạ'] }
        resolution: { score: 4, reason: 'Đã khắc phục, còn thiếu biện pháp lâu dài.' }
        proactiveness: { score: 3, reason: 'Chưa đề xuất nâng gói hosting.' }
      customer:
        needs: 'Website hoạt động ổn định để nhận đơn'
        products_of_interest: 'Hosting'
        current_solution: 'Hosting gói cơ bản'
      insight:
        summary: 'Chuỗi nhà thuốc bị gián đoạn bán hàng online do website quá tải.'
        interest_level: medium
        sentiment: concerned
        pain_points: ['Mất đơn khi website lỗi']
        barriers: []
        motivations: ['Hệ thống ổn định']
      conversation_state:
        already_done: ['Đã nâng tài nguyên máy chủ']
        open_questions: ['Làm sao tránh lỗi lặp lại']
      care:
        next_action: 'Đề xuất nâng gói hosting có tự mở rộng'
        talking_points: ['Báo cáo nguyên nhân sự cố', 'Cam kết thời gian hoạt động']
        opportunity: 'Nâng cấp lên hosting doanh nghiệp'
        contact_timing: 'Trong 1–2 ngày'

  - key: email_issue
    labels: ['su-co']
    priority: high
    messages:
      - in: 'Email công ty anh gửi ra ngoài bị vào spam hết em ơi.'
      - out: 'Dạ anh cho em xin tên miền email để em kiểm tra cấu hình ạ.'
      - in: 'saoviet-logistics.com.vn'
      - out: 'Dạ tên miền đang thiếu bản ghi SPF và DKIM nên thư dễ bị đánh dấu spam. Em đã tạo yêu cầu kỹ thuật để bổ sung, trong 24 giờ sẽ có hiệu lực ạ.'
    ticket:
      title: 'Bổ sung SPF, DKIM cho saoviet-logistics.com.vn'
      description: 'Email gửi ra ngoài bị vào spam do thiếu bản ghi SPF và DKIM.'

  - key: invoice
    labels: ['ke-toan']
    messages:
      - in: 'Em xuất giúp chị hóa đơn VAT cho đơn hàng tháng trước nhé.'
      - out: 'Dạ chị gửi em thông tin xuất hóa đơn: tên công ty, mã số thuế và địa chỉ ạ.'
      - in: 'Công ty CP Dược phẩm An Khang, MST 0312345678, 45 Lê Lợi, Quận 1.'
      - out: 'Dạ em đã xuất hóa đơn điện tử và gửi vào email kế toán của công ty mình rồi ạ.'
    csat: { rating: 5, feedback: '' }

  - key: contract_extend
    labels: ['gia-han']
    messages:
      - in: 'Hợp đồng bảo trì phần mềm của bên anh sắp hết, gia hạn có gì thay đổi không em?'
      - out: 'Dạ gói bảo trì năm nay có thêm sao lưu dữ liệu hằng ngày và hỗ trợ ngoài giờ. Phí giữ nguyên nếu anh gia hạn trước ngày 30 ạ.'
      - in: 'Vậy gửi anh phụ lục hợp đồng để anh ký nhé.'
      - out: 'Dạ em gửi phụ lục qua email trong hôm nay ạ.'

  - key: complaint_slow
    labels: ['khieu-nai']
    priority: high
    messages:
      - in: 'Chị báo lỗi từ hôm qua mà chưa ai xử lý, như vậy là quá chậm.'
      - out: 'Dạ em thành thật xin lỗi chị vì phản hồi chậm. Chị cho em xin mã yêu cầu hoặc mô tả lỗi để em ưu tiên xử lý ngay ạ.'
      - in: 'Phần mềm không in được hóa đơn, cửa hàng đang phải viết tay.'
      - out: 'Dạ lỗi do cập nhật driver máy in. Em đã gửi hướng dẫn cài lại, kỹ thuật cũng sẽ gọi hỗ trợ trực tiếp cho chị trong 15 phút tới ạ.'
    csat: { rating: 2, feedback: 'Phản hồi quá chậm, lần sau cần nhanh hơn' }
    analysis:
      served_by: agent
      quality:
        understanding: { score: 4, reason: 'Hiểu đúng vấn đề in hóa đơn.' }
        completeness: { score: 4, reason: 'Có hướng dẫn và hẹn hỗ trợ trực tiếp.' }
        accuracy: { score: 4, reason: 'Xác định đúng nguyên nhân do driver.' }
        tone: { score: 5, reason: 'Xin lỗi chân thành, không đổ lỗi.', evidence: ['Dạ em thành thật xin lỗi chị vì phản hồi chậm'] }
        resolution: { score: 3, reason: 'Chưa xác nhận khách đã in được.' }
        proactiveness: { score: 3, reason: 'Chưa đề xuất bù đắp cho sự chậm trễ.' }
      customer:
        needs: 'In được hóa đơn tại cửa hàng'
        products_of_interest: 'Phần mềm bán hàng'
      insight:
        summary: 'Khách bực vì báo lỗi từ hôm qua chưa được xử lý.'
        interest_level: low
        sentiment: frustrated
        pain_points: ['Phải viết hóa đơn tay', 'Chờ hỗ trợ quá lâu']
        barriers: ['Mất niềm tin vào tốc độ hỗ trợ']
        motivations: ['Được hỗ trợ nhanh']
      conversation_state:
        already_done: ['Gửi hướng dẫn cài lại driver', 'Hẹn kỹ thuật gọi trong 15 phút']
        open_questions: ['Đã in được hóa đơn chưa']
      care:
        next_action: 'Gọi xác nhận khách đã in được hóa đơn'
        talking_points: ['Xin lỗi về thời gian phản hồi', 'Cam kết thời gian xử lý lỗi']
        opportunity: ''
        contact_timing: 'Ngay hôm nay'

  - key: training
    labels: ['huong-dan']
    messages:
      - in: 'Em hướng dẫn chị cách xuất báo cáo tồn kho theo tháng với.'
      - out: 'Dạ chị vào menu Kho → Báo cáo → Tồn kho, chọn khoảng thời gian rồi bấm Xuất Excel ạ. Em gửi kèm video hướng dẫn 2 phút cho chị nhé.'
      - in: 'Được rồi em, cảm ơn em.'
    csat: { rating: 5, feedback: 'Hướng dẫn dễ hiểu' }

  - key: integration
    labels: ['huong-dan', 'su-co']
