version: '3'

services:
  base: &base
    image: chatwoot-custom:1.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/app/storage
      - ./config/environments/production.rb:/app/config/environments/production.rb:ro

  rails:
    <<: *base
    image: chatwoot-custom-rails:1.0
    depends_on:
      - redis
      - call-emotion
      - rag
    ports:
      - '5679:4000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CALL_EMOTION_SERVICE_URL=${CALL_EMOTION_SERVICE_URL:-http://call-emotion:8080}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://rag:8080}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '4000', '-b', '0.0.0.0']
    restart: always

  call-emotion:
    build:
      context: ./call_emotion
      dockerfile: Dockerfile
    image: chatwoot-call-emotion:1.0
    environment:
      - MODEL_DIR=/models
    volumes:
      - ${CALL_EMOTION_MODEL_HOST_PATH:-./call-emotion-model}:/models:ro
    restart: always

  sidekiq:
    <<: *base
    image: chatwoot-custom-sidekiq:1.0
    depends_on:
      - redis
      - rag
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://rag:8080}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  zalo:
    image: chatwoot-custom-rails:1.0
    pull_policy: never
    env_file: .env
    volumes:
      - ${ZALO_PROXY_POOL_HOST_PATH:-./.zalo-proxy-pool}:/run/secrets/zalo-proxy-pool:ro
    depends_on:
      - rails
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - ZALO_WORKER_HOST=0.0.0.0
    command: ['node', 'zalo_worker/dist/main.js']
    restart: always

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

  qdrant:
    image: qdrant/qdrant:v1.14.1
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  rag:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    image: chatwoot-rag:1.0
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tekomi_rag}
      - RAG_SERVICE_TOKEN=${RAG_SERVICE_TOKEN:-}
      - RAG_DENSE_MODEL=${RAG_DENSE_MODEL:-baai/bge-m3}
      - RAG_VOCAB_PATH=/data/vocabulary.sqlite3
    volumes:
      - rag_data:/data
    restart: always
volumes:
  storage_data:
  redis_data:
  qdrant_data:
  rag_data:
